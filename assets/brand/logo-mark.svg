<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d1d1f" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#42a5f5" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Squircle / Apple App Icon container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#ffffff" stroke="rgba(0,0,0,0.06)" stroke-width="4" filter="url(#subtleShadow)" />

  <!-- Iconic Monogram M & D -->
  <!-- Left Pillar of M -->
  <path d="M 128 360 L 128 160 C 128 148 138 140 150 140 L 176 140 C 186 140 195 146 199 155 L 256 268 L 313 155 C 317 146 326 140 336 140 L 340 140 C 352 140 362 148 362 160 L 362 208" 
        fill="none" stroke="url(#mdGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Flowing D Curve enclosing the right side -->
  <path d="M 256 268 L 298 348 C 303 358 313 364 324 364 L 336 364 C 378 364 408 330 408 284 C 408 238 376 208 336 208 L 296 208" 
        fill="none" stroke="url(#mdGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Connector of M -->
  <path d="M 128 360 L 196 360" fill="none" stroke="url(#mdGrad)" stroke-width="36" stroke-linecap="round" />

  <!-- The Optical Focal Point: Camera Lens Aperture / Digital Precision Core -->
  <circle cx="346" cy="286" r="14" fill="url(#accentGrad)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="100%" height="100%">
  <defs>
    <linearGradient id="mdDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d1d1f" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#42a5f5" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon on Left (140x140) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="140" height="140" rx="36" fill="#ffffff" stroke="rgba(0,0,0,0.08)" stroke-width="2" />
    <!-- Monogram lines scaled -->
    <path d="M 38 108 L 38 38 C 38 35 41 33 44 33 L 53 33 C 56 33 59 35 60 38 L 76 68 L 92 38 C 93 35 96 33 99 33 L 102 33" 
          fill="none" stroke="url(#mdDark)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 76 68 L 88 92 C 90 95 93 97 96 97 L 102 97 C 114 97 122 87 122 75 C 122 63 114 55 102 55 L 92 55" 
          fill="none" stroke="url(#mdDark)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="104" cy="76" r="4.5" fill="url(#blueAccent)" />
  </g>

  <!-- Typography on Right -->
  <g transform="translate(176, 52)">
    <!-- Primary Brand Name -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="40" font-weight="900" letter-spacing="-0.04em" fill="#1d1d1f">
      MD DIGITAL
    </text>
    <circle cx="282" cy="18" r="5" fill="url(#blueAccent)" />

    <!-- Subtitle / Positioning -->
    <text x="2" y="60" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.18em" fill="#86868b">
      STUDIO WIEN · WEB ARCHITECTURE &amp; CINEMA MEDIA
    </text>
  </g>
</svg>
